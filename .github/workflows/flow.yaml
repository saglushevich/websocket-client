name: "Websocket flow"

on: push

jobs:
    install:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                node-version: [18.x, 20.x]
        runs-on: ${{matrix.os}}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: install node-version
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - name: install depts
              run: yarn install

    lint:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                node-version: [18.x, 20.x]
        runs-on: ${{matrix.os}}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: setup node-version
              uses: actions/setup-node@v4
              with:
                  node-version: ${{matrix.node-version}}
            - name: install depts
              run: yarn install
            - name: lint
              run: yarn lint
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                node-version: [18.x, 20.x]
        runs-on: ${{matrix.os}}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: setup node-version
              uses: actions/setup-node@v4
              with:
                  node-version: ${{matrix.node-version}}
            - name: install depts
              run: yarn install
            - name: run build
              run: yarn build
